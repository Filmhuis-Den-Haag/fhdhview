[project]
name = "fhdhview"
version = "0.1.0"
description = "Filmhuis Den Haag schedule viewer"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic-xml (>=2.21.1,<3.0.0)",
    "sqlmodel (>=0.0.42,<0.0.43)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Path"]
